<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>Bio Site</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
:root {
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
    --glass-bg: rgba(20, 20, 20, 0.38);
    --glass-border: rgba(255, 255, 255, 0.1);
    --px: 0;
    --py: 0;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Outfit', sans-serif;
    -webkit-font-smoothing: antialiased;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
}

html, body { height: 100%; }

body {
    background: #050505;
    color: #fff;
    overflow: hidden;
}

/* ---------- INTRO: revela o site a partir do ponto do clique ---------- */
#intro {
    --x: 50%;
    --y: 50%;
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    background: #000;
    border: 0;
    color: rgba(255, 255, 255, 0.65);
    cursor: pointer;
    clip-path: circle(150vmax at var(--x) var(--y));
    transition: clip-path 1.2s var(--ease);
}
#intro.open { clip-path: circle(0 at var(--x) var(--y)); pointer-events: none; }
#intro span {
    font-size: 0.85rem;
    font-weight: 300;
    letter-spacing: 4px;
    text-transform: uppercase;
    animation: pulse 2.2s infinite ease-in-out;
}
#intro i {
    width: 1px;
    height: 46px;
    background: linear-gradient(to bottom, rgba(255,255,255,0.7), transparent);
    transform-origin: top;
    animation: drip 2.2s infinite ease-in-out;
}
@keyframes pulse { 0%,100% { opacity: .3 } 50% { opacity: 1 } }
@keyframes drip  { 0% { transform: scaleY(0) } 60% { transform: scaleY(1); opacity: 1 } 100% { transform: scaleY(1); opacity: 0 } }

/* ---------- FUNDO ---------- */
.video-background {
    position: fixed;
    top: 50%; left: 50%;
    min-width: 100%; min-height: 100%;
    object-fit: cover;
    z-index: -3;
    pointer-events: none;
    opacity: 0;
    transform: translate(calc(-50% + var(--px) * -14px), calc(-50% + var(--py) * -14px)) scale(1.18);
    filter: blur(14px) brightness(.6);
    transition: opacity 2s var(--ease), filter 2.4s var(--ease), transform 1.6s var(--ease);
}
body.on .video-background {
    opacity: 1;
    filter: blur(0) brightness(1);
    transform: translate(calc(-50% + var(--px) * -14px), calc(-50% + var(--py) * -14px)) scale(1.07);
}

.video-overlay {
    position: fixed; inset: 0; z-index: -2;
    background: radial-gradient(circle at 50% 45%, rgba(0,0,0,.25) 0%, rgba(0,0,0,.88) 100%);
    opacity: 0;
    transition: opacity 1.8s var(--ease);
}
body.on .video-overlay { opacity: 1; }

/* grão de filme: dá textura e esconde compressão do vídeo */
.grain {
    position: fixed; inset: -50%; z-index: -1; pointer-events: none; opacity: .07;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    animation: grain 1.2s steps(6) infinite;
}
@keyframes grain {
    0% { transform: translate(0,0) } 20% { transform: translate(-3%,2%) } 40% { transform: translate(2%,-3%) }
    60% { transform: translate(-2%,-1%) } 80% { transform: translate(3%,3%) } 100% { transform: translate(0,0) }
}

/* ---------- PALCO (rola se a tela for baixa) ---------- */
.stage {
    height: 100%;
    overflow-y: auto;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-bottom: 150px;
    scrollbar-width: none;
}
.stage::-webkit-scrollbar { display: none; }

/* elementos que entram em cascata: blur -> nítido */
.reveal {
    opacity: 0;
    transform: translateY(26px) scale(.97);
    filter: blur(10px);
    transition: opacity 1.1s var(--ease), transform 1.1s var(--ease), filter 1.1s var(--ease);
    transition-delay: calc(var(--i, 0) * 110ms + 250ms);
}
body.on .reveal { opacity: 1; transform: none; filter: blur(0); }

/* ---------- BANNER ---------- */
.banner {
    width: 100%;
    height: 22vh;
    min-height: 130px;
    flex-shrink: 0;
    background: url('./capim/banner.jpg') center/cover no-repeat;
    position: relative;
    clip-path: inset(0 0 100% 0);
    transition: clip-path 1.3s var(--ease) .1s;
}
body.on .banner { clip-path: inset(0 0 0 0); }
.banner::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(to bottom, transparent 0%, rgba(5,5,5,.6) 60%, #050505 100%);
}

/* ---------- PERFIL ---------- */
.profile {
    margin-top: -60px;
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
}
.avatar {
    position: relative;
    width: 120px; height: 120px;
    border-radius: 50%;
    padding: 3px;
    background: conic-gradient(from 0deg, #fff, rgba(255,255,255,.08) 30%, #fff 55%, rgba(255,255,255,.08) 80%, #fff);
    animation: spin 6s linear infinite paused;
    box-shadow: 0 10px 30px rgba(0,0,0,.8);
}
body.on .avatar { animation-play-state: running; }
.avatar::before { /* halo difuso atrás da foto */
    content: ''; position: absolute; inset: -14px; border-radius: 50%; z-index: -1;
    background: radial-gradient(circle, rgba(255,255,255,.22), transparent 70%);
    animation: breathe 4s ease-in-out infinite;
}
.avatar img {
    width: 100%; height: 100%;
    border-radius: 50%;
    object-fit: cover;
    display: block;
    border: 3px solid #050505;
    animation: spin 6s linear infinite reverse paused; /* contra-gira p/ foto ficar parada */
}
body.on .avatar img { animation-play-state: running; }
@keyframes spin    { to { transform: rotate(360deg) } }
@keyframes breathe { 0%,100% { opacity: .5; transform: scale(.95) } 50% { opacity: 1; transform: scale(1.08) } }

.nickname {
    margin-top: 16px;
    font-size: 1.25rem;
    font-weight: 600;
    letter-spacing: .5px;
    display: flex;
    text-shadow: 0 2px 15px #000;
}
.nickname span {
    display: inline-block;
    opacity: 0;
    transform: translateY(14px);
    filter: blur(8px);
    transition: all .9s var(--ease);
    transition-delay: calc(var(--c) * 55ms + 700ms);
    white-space: pre;
}
body.on .nickname span { opacity: 1; transform: none; filter: blur(0); }

/* ---------- LINKS ---------- */
.links {
    margin-top: 30px;
    width: 90%;
    max-width: 340px;
    display: flex;
    flex-direction: column;
    gap: 12px;
}
.link-btn {
    --mx: 50%; --my: 50%;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: var(--glass-bg);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    border-radius: 16px;
    color: #fff;
    text-decoration: none;
    font-weight: 500;
    font-size: .95rem;
    letter-spacing: .5px;
    /* transform separado do .reveal para não brigar com a entrada */
    translate: var(--tx, 0px) var(--ty, 0px);
    transition: opacity 1.1s var(--ease), filter 1.1s var(--ease),
                transform 1.1s var(--ease), translate .5s var(--ease),
                border-color .4s, background .4s, scale .4s var(--ease);
}
.link-btn::before { /* luz que segue o cursor */
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(180px circle at var(--mx) var(--my), rgba(255,255,255,.22), transparent 65%);
    opacity: 0;
    transition: opacity .4s;
}
.link-btn::after { /* brilho que varre o botão */
    content: '';
    position: absolute; top: 0; bottom: 0; left: -60%;
    width: 40%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,.18), transparent);
    transform: skewX(-18deg);
}
.link-btn:hover::after { left: 130%; transition: left .9s var(--ease); }
.link-btn:hover::before { opacity: 1; }
.link-btn:hover { border-color: rgba(255,255,255,.45); background: rgba(30,30,30,.5); scale: 1.03; }
.link-btn:active { scale: .97; }
.link-btn:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }

/* ---------- PIX ---------- */
.pix {
    position: fixed;
    left: 40px; bottom: 40px;
    z-index: 10;
    display: flex; flex-direction: column; align-items: center;
    background: none; border: 0; cursor: pointer;
    --i: 6;
}
.qr {
    position: relative;
    background: #fff;
    padding: 10px;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,.5);
    transition: transform .5s var(--ease), box-shadow .5s var(--ease);
}
.qr::after { /* onda que chama atenção para o QR */
    content: ''; position: absolute; inset: 0; border-radius: 16px;
    border: 2px solid rgba(255,255,255,.6);
    animation: ping 3s var(--ease) infinite 2s;
    pointer-events: none;
}
@keyframes ping { 0% { transform: scale(1); opacity: .8 } 70%,100% { transform: scale(1.35); opacity: 0 } }
.pix:hover .qr { transform: scale(1.08) translateY(-5px); box-shadow: 0 15px 40px rgba(255,255,255,.2); }
.pix:focus-visible .qr { outline: 2px solid #fff; outline-offset: 4px; }
.qr img { width: 110px; height: 110px; display: block; }

.toast {
    position: absolute;
    bottom: 130px;
    background: #4ade80; color: #000;
    font-size: .8rem; font-weight: 600;
    padding: 6px 16px;
    border-radius: 20px;
    white-space: nowrap;
    opacity: 0;
    transform: translateY(10px) scale(.9);
    transition: all .4s var(--ease);
    pointer-events: none;
    box-shadow: 0 5px 15px rgba(74,222,128,.3);
}
.toast.show { opacity: 1; transform: none; }

/* ---------- MOBILE ---------- */
@media (max-width: 768px) {
    .banner { height: 20vh; }
    .profile { margin-top: -50px; }
    .avatar { width: 100px; height: 100px; }
    .nickname { font-size: 1.1rem; }
    .links { margin-top: 24px; gap: 10px; }
    .pix { left: 20px; bottom: 20px; }
    .qr { padding: 6px; border-radius: 12px; }
    .qr img { width: 60px; height: 60px; }
    .toast { bottom: 75px; font-size: .7rem; padding: 4px 10px; }
    .stage { padding-bottom: 110px; }
}

/* respeita quem desativa animações no sistema */
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; transition-delay: 0s !important; }
    .grain { display: none; }
}
</style>
</head>
<body>

<button id="intro" type="button" aria-label="Entrar no site">
    <span>Clique para entrar</span>
    <i></i>
</button>

<video id="bg-video" class="video-background" src="capim/fundo.mp4" loop muted playsinline preload="auto"></video>
<div class="video-overlay"></div>
<div class="grain"></div>

<main class="stage">
    <div class="banner"></div>

    <section class="profile">
        <div class="avatar reveal" style="--i:0">
            <img src="capim/foto.jpg" alt="Foto de perfil" draggable="false">
        </div>
        <div class="nickname" id="nick" aria-label="Seu Nick">Seu Nick</div>
    </section>

    <nav class="links">
        <a href="#" class="link-btn reveal" style="--i:3" target="_blank" rel="noopener">Instagram</a>
        <a href="#" class="link-btn reveal" style="--i:4" target="_blank" rel="noopener">YouTube</a>
        <a href="#" class="link-btn reveal" style="--i:5" target="_blank" rel="noopener">Portfólio</a>
        <a href="#" class="link-btn reveal" style="--i:6" target="_blank" rel="noopener">WhatsApp</a>
    </nav>
</main>

<button class="pix reveal" id="pix" type="button" aria-label="Copiar chave Pix">
    <div class="qr">
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=ChavePixFicticia123&color=000000&bgcolor=FFFFFF" alt="QR Code Pix" draggable="false">
    </div>
    <div class="toast" id="toast">Copiado! ✅</div>
</button>

<script>
document.addEventListener('contextmenu', e => e.preventDefault());

const $ = id => document.getElementById(id);
const intro = $('intro'), video = $('bg-video');
const fine = matchMedia('(hover: hover) and (pointer: fine)').matches;

/* Nick vira letras individuais para a animação em onda */
const nick = $('nick');
[...nick.textContent].forEach((ch, i) => {
    const s = document.createElement('span');
    s.textContent = ch;
    s.style.setProperty('--c', i);
    s.setAttribute('aria-hidden', 'true');
    nick.appendChild(s);
});
nick.firstChild.remove?.();
nick.childNodes.forEach(n => { if (n.nodeType === 3) n.remove(); });

/* Entrar: o círculo preto fecha no ponto do clique */
let entered = false;
function enter(e) {
    if (entered) return;
    entered = true;
    const x = e && e.clientX ? e.clientX : innerWidth / 2;
    const y = e && e.clientY ? e.clientY : innerHeight / 2;
    intro.style.setProperty('--x', x + 'px');
    intro.style.setProperty('--y', y + 'px');
    requestAnimationFrame(() => {
        intro.classList.add('open');
        document.body.classList.add('on');
    });
    video.play().catch(err => console.log('Autoplay bloqueado:', err));
    setTimeout(() => intro.remove(), 1400);
}
intro.addEventListener('click', enter);

/* Parallax suave do fundo + luz nos botões (só com mouse) */
if (fine) {
    addEventListener('pointermove', e => {
        const r = document.documentElement.style;
        r.setProperty('--px', (e.clientX / innerWidth - .5).toFixed(3));
        r.setProperty('--py', (e.clientY / innerHeight - .5).toFixed(3));
    });
    document.querySelectorAll('.link-btn').forEach(b => {
        b.addEventListener('pointermove', e => {
            const r = b.getBoundingClientRect();
            const x = e.clientX - r.left, y = e.clientY - r.top;
            b.style.setProperty('--mx', x + 'px');
            b.style.setProperty('--my', y + 'px');
            /* efeito magnético: o botão "puxa" um pouco em direção ao cursor */
            b.style.setProperty('--tx', ((x / r.width - .5) * 8).toFixed(1) + 'px');
            b.style.setProperty('--ty', ((y / r.height - .5) * 6).toFixed(1) + 'px');
        });
        b.addEventListener('pointerleave', () => {
            b.style.setProperty('--tx', '0px');
            b.style.setProperty('--ty', '0px');
        });
    });
}

/* Copiar Pix */
const chavePix = 'seu-email@exemplo.com'; // ⚠️ COLOQUE SUA CHAVE AQUI
const toast = $('toast');
function copiado() {
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2500);
}
$('pix').addEventListener('click', () => {
    (navigator.clipboard
        ? navigator.clipboard.writeText(chavePix)
        : Promise.reject()
    ).then(copiado).catch(() => {
        const t = document.createElement('textarea');
        t.value = chavePix; document.body.appendChild(t); t.select();
        try { document.execCommand('copy'); copiado(); }
        catch { alert('Erro ao copiar. A chave é: ' + chavePix); }
        t.remove();
    });
});
</script>
</body>
</html>
