<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>Bio Site</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
:root {
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
    --glass-bg: rgba(20, 20, 20, 0.38);
    --glass-border: rgba(255, 255, 255, 0.1);
    --px: 0;
    --py: 0;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Outfit', sans-serif;
    -webkit-font-smoothing: antialiased;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
}

html, body { height: 100%; }

body {
    background: #050505;
    color: #fff;
    overflow: hidden;
}

/* ---------- INTRO: revela o site a partir do ponto do clique ---------- */
#intro {
    --x: 50%;
    --y: 50%;
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    background: #000;
    border: 0;
    color: rgba(255, 255, 255, 0.65);
    cursor: pointer;
    clip-path: circle(150vmax at var(--x) var(--y));
    transition: clip-path 1.2s var(--ease);
}
#intro.open { clip-path: circle(0 at var(--x) var(--y)); pointer-events: none; }
#intro span {
    font-size: 0.85rem;
    font-weight: 300;
    letter-spacing: 4px;
    text-transform: uppercase;
    animation: pulse 2.2s infinite ease-in-out;
}
#intro i {
    width: 1px;
    height: 46px;
    background: linear-gradient(to bottom, rgba(255,255,255,0.7), transparent);
    transform-origin: top;
    animation: drip 2.2s infinite ease-in-out;
}
@keyframes pulse { 0%,100% { opacity: .3 } 50% { opacity: 1 } }
@keyframes drip  { 0% { transform: scaleY(0) } 60% { transform: scaleY(1); opacity: 1 } 100% { transform: scaleY(1); opacity: 0 } }

/* ---------- FUNDO ---------- */
.video-background {
    position: fixed;
    top: 50%; left: 50%;
    min-width: 100%; min-height: 100%;
    object-fit: cover;
    z-index: -3;
    pointer-events: none;
    opacity: 0;
    transform: translate(calc(-50% + var(--px) * -14px), calc(-50% + var(--py) * -14px)) scale(1.18);
    filter: blur(14px) brightness(.6);
    transition: opacity 2s var(--ease), filter 2.4s var(--ease), transform 1.6s var(--ease);
}
body.on .video-background {
    opacity: 1;
    filter: blur(0) brightness(1);
    transform: translate(calc(-50% + var(--px) * -14px), calc(-50% + var(--py) * -14px)) scale(1.07);
}

.video-overlay {
    position: fixed; inset: 0; z-index: -2;
    background: radial-gradient(circle at 50% 45%, rgba(0,0,0,.25) 0%, rgba(0,0,0,.88) 100%);
    opacity: 0;
    transition: opacity 1.8s var(--ease);
}
body.on .video-overlay { opacity: 1; }

/* grão de filme: dá textura e esconde compressão do vídeo */
.grain {
    position: fixed; inset: -50%; z-index: -1; pointer-events: none; opacity: .07;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    animation: grain 1.2s steps(6) infinite;
}
@keyframes grain {
    0% { transform: translate(0,0) } 20% { transform: translate(-3%,2%) } 40% { transform: translate(2%,-3%) }
    60% { transform: translate(-2%,-1%) } 80% { transform: translate(3%,3%) } 100% { transform: translate(0,0) }
}

/* ---------- PALCO (rola se a tela for baixa) ---------- */
.stage {
    height: 100%;
    overflow-y: auto;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-bottom: 150px;
    scrollbar-width: none;
}
.stage::-webkit-scrollbar { display: none; }

/* elementos que entram em cascata: blur -> nítido */
.reveal {
    opacity: 0;
    transform: translateY(26px) scale(.97);
    filter: blur(10px);
    transition: opacity 1.1s var(--ease), transform 1.1s var(--ease), filter 1.1s var(--ease);
    transition-delay: calc(var(--i, 0) * 110ms + 250ms);
}
body.on .reveal { opacity: 1; transform: none; filter: blur(0); }

/* ---------- BANNER ---------- */
.banner {
    width: 100%;
    height: 22vh;
    min-height: 130px;
    flex-shrink: 0;
    background: linear-gradient(135deg, #1c1c24, #0a0a0d) center/cover no-repeat; /* fallback se não achar o banner */
    position: relative;
    clip-path: inset(0 0 100% 0);
    transition: clip-path 1.3s var(--ease) .1s;
}
body.on .banner { clip-path: inset(0 0 0 0); }
.banner::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(to bottom, transparent 0%, rgba(5,5,5,.6) 60%, #050505 100%);
}

/* ---------- PERFIL ---------- */
.profile {
    margin-top: -60px;
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
}
.avatar {
    position: relative;
    width: 120px; height: 120px;
    border-radius: 50%;
    padding: 3px;
    background: conic-gradient(from 0deg, #fff, rgba(255,255,255,.08) 30%, #fff 55%, rgba(255,255,255,.08) 80%, #fff);
    animation: spin 6s linear infinite paused;
    box-shadow: 0 10px 30px rgba(0,0,0,.8);
}
body.on .avatar { animation-play-state: running; }
.avatar::before { /* halo difuso atrás da foto */
    content: ''; position: absolute; inset: -14px; border-radius: 50%; z-index: -1;
    background: radial-gradient(circle, rgba(255,255,255,.22), transparent 70%);
    animation: breathe 4s ease-in-out infinite;
}
.avatar img {
    width: 100%; height: 100%;
    border-radius: 50%;
    object-fit: cover;
    display: block;
    border: 3px solid #050505;
    animation: spin 6s linear infinite reverse paused; /* contra-gira p/ foto ficar parada */
}
body.on .avatar img { animation-play-state: running; }
@keyframes spin    { to { rotate: 360deg } }
@keyframes breathe { 0%,100% { opacity: .5; transform: scale(.95) } 50% { opacity: 1; transform: scale(1.08) } }

.nickname {
    margin-top: 16px;
    font-size: 1.25rem;
    font-weight: 600;
    letter-spacing: .5px;
    display: flex;
    text-shadow: 0 2px 15px #000;
}
.nickname span {
    display: inline-block;
    opacity: 0;
    transform: translateY(14px);
    filter: blur(8px);
    transition: all .9s var(--ease);
    transition-delay: calc(var(--c) * 55ms + 700ms);
    white-space: pre;
}
body.on .nickname span { opacity: 1; transform: none; filter: blur(0); }

/* ---------- LINKS ---------- */
.links {
    margin-top: 30px;
    width: 90%;
    max-width: 340px;
    display: flex;
    flex-direction: column;
    gap: 12px;
}
.link-btn {
    --mx: 50%; --my: 50%;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: var(--glass-bg);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    border-radius: 16px;
    color: #fff;
    text-decoration: none;
    font-weight: 500;
    font-size: .95rem;
    letter-spacing: .5px;
    /* transform separado do .reveal para não brigar com a entrada */
    translate: var(--tx, 0px) var(--ty, 0px);
    transition: opacity 1.1s var(--ease), filter 1.1s var(--ease),
                transform 1.1s var(--ease), translate .5s var(--ease),
                border-color .4s, background .4s, scale .4s var(--ease);
}
.link-btn::before { /* luz que segue o cursor */
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(180px circle at var(--mx) var(--my), rgba(255,255,255,.22), transparent 65%);
    opacity: 0;
    transition: opacity .4s;
}
.link-btn::after { /* brilho que varre o botão */
    content: '';
    position: absolute; top: 0; bottom: 0; left: -60%;
    width: 40%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,.18), transparent);
    transform: skewX(-18deg);
}
.link-btn:hover::after { left: 130%; transition: left .9s var(--ease); }
.link-btn:hover::before { opacity: 1; }
.link-btn:hover { border-color: rgba(255,255,255,.45); background: rgba(30,30,30,.5); scale: 1.03; }
.link-btn:active { scale: .97; }
.link-btn:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }

/* ---------- PIX ---------- */
.pix {
    position: fixed;
    left: 40px; bottom: 40px;
    z-index: 10;
    display: flex; flex-direction: column; align-items: center;
    background: none; border: 0; cursor: pointer;
    --i: 6;
}
.qr {
    position: relative;
    background: #fff;
    padding: 10px;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,.5);
    transition: transform .5s var(--ease), box-shadow .5s var(--ease);
}
.qr::after { /* onda que chama atenção para o QR */
    content: ''; position: absolute; inset: 0; border-radius: 16px;
    border: 2px solid rgba(255,255,255,.6);
    animation: ping 3s var(--ease) infinite 2s;
    pointer-events: none;
}
@keyframes ping { 0% { transform: scale(1); opacity: .8 } 70%,100% { transform: scale(1.35); opacity: 0 } }
.pix:hover .qr { transform: scale(1.08) translateY(-5px); box-shadow: 0 15px 40px rgba(255,255,255,.2); }
.pix:focus-visible .qr { outline: 2px solid #fff; outline-offset: 4px; }
.qr img { width: 110px; height: 110px; display: block; }

.toast {
    position: absolute;
    bottom: 130px;
    background: #4ade80; color: #000;
    font-size: .8rem; font-weight: 600;
    padding: 6px 16px;
    border-radius: 20px;
    white-space: nowrap;
    opacity: 0;
    transform: translateY(10px) scale(.9);
    transition: all .4s var(--ease);
    pointer-events: none;
    box-shadow: 0 5px 15px rgba(74,222,128,.3);
}
.toast.show { opacity: 1; transform: none; }

/* ---------- BARRA DE VOLUME (estilo iPhone) ---------- */
:root { --panel-w: min(340px, 86vw); }

.vol {
    position: fixed;
    left: 50%; bottom: 36px;
    translate: -50% 0;
    z-index: 10;
    width: 220px;
    display: flex; align-items: center; gap: 12px;
    padding: 6px 0;
}
.vol-btn {
    flex-shrink: 0; width: 24px; height: 24px;
    display: grid; place-items: center;
    background: none; border: 0; color: #fff; cursor: pointer;
    transition: scale .3s var(--ease);
}
.vol-btn:active { scale: .85; }
.vol-btn svg { width: 22px; height: 22px; overflow: visible; filter: drop-shadow(0 2px 6px rgba(0,0,0,.65)); }
.vol-btn .w1, .vol-btn .w2, .vol-btn .wx { transition: opacity .3s; }
.vol-btn .wx { opacity: 0; }
.vol[data-level="0"] .w1, .vol[data-level="0"] .w2 { opacity: 0; }
.vol[data-level="0"] .wx { opacity: 1; }
.vol[data-level="1"] .w2 { opacity: 0; }

.vol-track {
    position: relative;
    flex: 1;
    height: 22px;            /* área de toque grande, barra visível é menor */
    display: flex; align-items: center;
    cursor: pointer;
    touch-action: none;
}
.vol-bar {
    position: relative;
    width: 100%; height: 6px;
    border-radius: 99px;
    background: rgba(255,255,255,.28);
    box-shadow: 0 2px 10px rgba(0,0,0,.55), 0 0 0 .5px rgba(0,0,0,.25);
    overflow: hidden;
    transition: height .35s var(--ease);
}
.vol-fill {
    position: absolute; inset: 0 auto 0 0;
    width: 40%;
    background: #fff;
    border-radius: 99px;
}
.vol-track:hover .vol-bar,
.vol-track:focus-visible .vol-bar,
.vol.drag .vol-bar { height: 12px; }   /* engrossa ao tocar, como no iOS */
.vol-track:focus-visible { outline: 2px solid #fff; outline-offset: 4px; border-radius: 99px; }
.vol-btn:focus-visible { outline: 2px solid #fff; outline-offset: 4px; border-radius: 6px; }

/* porcentagem (aparece ao mexer) e selo do Spotify, ambos ao lado da barra */
.vol-pct, .vol-sp {
    position: absolute; left: calc(100% + 12px); top: 50%;
    translate: 0 -50%;
}
.vol-pct {
    font-size: .85rem; font-weight: 500; font-variant-numeric: tabular-nums;
    text-shadow: 0 1px 8px rgba(0,0,0,.85);
    opacity: 0; pointer-events: none;
    transition: opacity .35s var(--ease);
}
.vol.show-pct .vol-pct { opacity: 1; }
.vol-sp {
    width: 26px; height: 26px; padding: 0;
    background: none; border: 0; cursor: pointer;
    opacity: 0; scale: .6; pointer-events: none;
    transition: opacity .4s var(--ease), scale .4s var(--ease);
}
.vol-sp svg { display: block; width: 100%; height: 100%; filter: drop-shadow(0 2px 6px rgba(0,0,0,.6)); }
.vol-sp:focus-visible { outline: 2px solid #fff; outline-offset: 3px; border-radius: 50%; }
.vol.spotify .vol-sp { opacity: 1; scale: 1; pointer-events: auto; }
.vol.spotify .vol-sp svg { animation: beat 2.2s ease-in-out infinite; }
.vol.spotify .vol-pct { opacity: 0; }
.vol.spotify .vol-track, .vol.spotify .vol-btn { opacity: .4; pointer-events: none; }
.vol-track, .vol-btn { transition: opacity .5s var(--ease); }
@keyframes beat { 0%,100% { scale: 1 } 50% { scale: 1.12 } }

/* ---------- PLAYLIST (aba na direita + painel) ---------- */
.music-tab {
    position: fixed;
    right: 0; top: 50%;
    translate: 0 -50%;
    z-index: 21;
    opacity: 0;
    transition: opacity 1s var(--ease) 1.3s;
}
body.on .music-tab { opacity: 1; }

.music-btn {
    width: 46px; height: 72px;
    display: grid; place-items: center;
    color: #fff; cursor: pointer;
    background: rgba(20,20,20,.7);
    border: 1px solid var(--glass-border); border-right: 0;
    border-radius: 18px 0 0 18px;
    box-shadow: -6px 6px 24px rgba(0,0,0,.4);
    transition: translate .8s var(--ease), background .3s, width .4s var(--ease);
}
.music-btn:hover { background: rgba(45,45,45,.85); width: 52px; }
.music-btn:focus-visible { outline: 2px solid #fff; outline-offset: -4px; }
.music-btn svg { width: 22px; height: 22px; grid-area: 1/1; transition: opacity .3s, transform .5s var(--ease); }
.music-btn .i-close { opacity: 0; transform: rotate(-90deg); }
body.music-open .music-btn { translate: calc(-1 * var(--panel-w)) 0; }
body.music-open .music-btn .i-note { opacity: 0; transform: rotate(90deg); }
body.music-open .music-btn .i-close { opacity: 1; transform: none; }

.music-scrim {
    position: fixed; inset: 0; z-index: 15;
    background: rgba(0,0,0,.35);
    opacity: 0; visibility: hidden;
    transition: opacity .6s var(--ease), visibility .6s;
}
body.music-open .music-scrim { opacity: 1; visibility: visible; }

.music-panel {
    position: fixed; top: 0; right: 0; bottom: 0;
    z-index: 20;
    width: var(--panel-w);
    padding: calc(env(safe-area-inset-top, 0px) + 24px) 18px calc(env(safe-area-inset-bottom, 0px) + 20px);
    display: flex; flex-direction: column; gap: 18px;
    background: rgba(12,12,12,.72);
    backdrop-filter: blur(28px) saturate(1.4);
    -webkit-backdrop-filter: blur(28px) saturate(1.4);
    border-left: 1px solid var(--glass-border);
    transform: translateX(100%);
    transition: transform .8s var(--ease);
}
body.music-open .music-panel { transform: none; box-shadow: -20px 0 60px rgba(0,0,0,.5); }

.music-panel h2 { font-size: 1.15rem; font-weight: 600; letter-spacing: .3px; }

.m-links { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.m-link {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    padding: 12px 8px;
    color: #fff; text-decoration: none;
    font-size: .9rem; font-weight: 500;
    background: rgba(255,255,255,.07);
    border: 1px solid var(--glass-border);
    border-radius: 14px;
    transition: background .3s, scale .3s var(--ease);
}
.m-link i { width: 9px; height: 9px; border-radius: 50%; background: var(--dot, #fff); }
.m-link:hover { background: rgba(255,255,255,.16); scale: 1.03; }
.m-link:active { scale: .97; }
.m-link:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

.embed { flex: 1; min-height: 0; border-radius: 12px; overflow: hidden; }
.embed iframe, .embed > div { display: block; width: 100% !important; height: 100% !important; border: 0; border-radius: 12px; }

/* ---------- ARQUIVOS AUSENTES: fundo alternativo e foto sem imagem ---------- */
.aurora { position: fixed; inset: 0; z-index: -4; display: none; overflow: hidden; background: #07070a; }
body.no-video .aurora { display: block; }
.aurora::before, .aurora::after {
    content: ''; position: absolute; width: 70vmax; height: 70vmax; border-radius: 50%;
    filter: blur(80px); opacity: .5; animation: drift 18s ease-in-out infinite alternate;
}
.aurora::before { background: #3b3b6b; top: -20vmax; left: -15vmax; }
.aurora::after  { background: #1f4b4a; bottom: -25vmax; right: -15vmax; animation-delay: -9s; }
@keyframes drift { to { translate: 12vmax 8vmax; } }

.avatar img:not([src]) { visibility: hidden; }
.avatar.no-photo img { display: none; }
.avatar.no-photo::after {
    content: attr(data-letter);
    position: absolute; inset: 3px; border-radius: 50%;
    background: #111; display: grid; place-items: center;
    font-size: 2.6rem; font-weight: 600;
    animation: spin 6s linear infinite reverse paused;
}
body.on .avatar.no-photo::after { animation-play-state: running; }

@media (max-width: 768px) {
    .vol { bottom: 28px; width: clamp(112px, calc(100vw - 210px), 170px); gap: 9px; }
    .vol-btn svg { width: 18px; height: 18px; }
    .music-btn { width: 40px; height: 62px; }
}

/* ---------- MOBILE ---------- */
@media (max-width: 768px) {
    .banner { height: 20vh; }
    .profile { margin-top: -50px; }
    .avatar { width: 100px; height: 100px; }
    .nickname { font-size: 1.1rem; }
    .links { margin-top: 24px; gap: 10px; }
    .pix { left: 20px; bottom: 20px; }
    .qr { padding: 6px; border-radius: 12px; }
    .qr img { width: 60px; height: 60px; }
    .toast { bottom: 75px; font-size: .7rem; padding: 4px 10px; }
    .stage { padding-bottom: 110px; }
}

/* respeita quem desativa animações no sistema */
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; transition-delay: 0s !important; }
    .grain { display: none; }
}
</style>
</head>
<body>

<button id="intro" type="button" aria-label="Entrar no site">
    <span>Clique para entrar</span>
    <i></i>
</button>

<div class="aurora"></div>
<video id="bg-video" class="video-background" loop muted playsinline preload="auto"></video>
<div class="video-overlay"></div>
<div class="grain"></div>

<main class="stage">
    <div class="banner" id="banner-img"></div>

    <section class="profile">
        <div class="avatar reveal" id="avatar" data-letter="?" style="--i:0">
            <img id="foto" alt="Foto de perfil" draggable="false">
        </div>
        <div class="nickname" id="nick" aria-label="Seu Nick">Seu Nick</div>
    </section>

    <nav class="links">
        <a href="#" class="link-btn reveal" style="--i:3" target="_blank" rel="noopener">Instagram</a>
        <a href="#" class="link-btn reveal" style="--i:4" target="_blank" rel="noopener">YouTube</a>
        <a href="#" class="link-btn reveal" style="--i:5" target="_blank" rel="noopener">Portfólio</a>
        <a href="#" class="link-btn reveal" style="--i:6" target="_blank" rel="noopener">WhatsApp</a>
    </nav>
</main>

<button class="pix reveal" id="pix" type="button" aria-label="Copiar chave Pix">
    <div class="qr">
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=ChavePixFicticia123&color=000000&bgcolor=FFFFFF" alt="QR Code Pix" draggable="false">
    </div>
    <div class="toast" id="toast">Copiado! ✅</div>
</button>

<!-- Volume (estilo iPhone) -->
<div class="vol reveal" id="vol" data-level="2" style="--i:7">
    <button class="vol-btn" id="vol-mute" type="button" aria-label="Silenciar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M11 5 6 9H2v6h4l5 4V5z" fill="currentColor"/>
            <path class="w1" d="M15.5 8.5a5 5 0 0 1 0 7"/>
            <path class="w2" d="M18.5 5.5a9 9 0 0 1 0 13"/>
            <path class="wx" d="M16 9l5 6M21 9l-5 6"/>
        </svg>
    </button>
    <div class="vol-track" id="vol-track" role="slider" tabindex="0" aria-label="Volume do vídeo" aria-valuemin="0" aria-valuemax="100" aria-valuenow="40">
        <div class="vol-bar"><div class="vol-fill" id="vol-fill"></div></div>
    </div>
    <span class="vol-pct" id="vol-pct" aria-live="polite">40%</span>
    <button class="vol-sp" id="vol-sp" type="button" aria-label="Tocando no Spotify. Toque para pausar">
        <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="12" fill="#1ed760"/>
            <g fill="none" stroke="#000" stroke-linecap="round">
                <path d="M5.6 9c4.4-1.3 9.4-.9 13 1.3" stroke-width="1.9"/>
                <path d="M6.3 12.5c3.7-1 7.7-.7 10.8 1.1" stroke-width="1.6"/>
                <path d="M7 15.8c3-.8 6-.5 8.6.9" stroke-width="1.3"/>
            </g>
        </svg>
    </button>
</div>

<!-- Aba da playlist (lado direito) -->
<div class="music-tab">
    <button class="music-btn" id="music-btn" type="button" aria-label="Abrir playlist" aria-expanded="false" aria-controls="music-panel">
        <svg class="i-note" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        <svg class="i-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
    </button>
</div>
<div class="music-scrim" id="music-scrim"></div>
<aside class="music-panel" id="music-panel" aria-label="Playlist" inert>
    <h2>Minha playlist</h2>
    <div class="m-links">
        <!-- ⚠️ COLOQUE O LINK DA SUA PLAYLIST DO LINER AQUI -->
        <a class="m-link" style="--dot:#1ed760" href="https://open.spotify.com/playlist/2sw1VROZNQphIfwXJ8Zaeq?si=ff500b186a954e76" target="_blank" rel="noopener" aria-label="Abrir playlist no Spotify"><i></i>Spotify</a>
        <a class="m-link" href="#" target="_blank" rel="noopener" aria-label="Abrir playlist no Liner"><i></i>Liner</a>
    </div>
    <div class="embed" id="embed"></div>
</aside>

<script>
document.addEventListener('contextmenu', e => e.preventDefault());

const $ = id => document.getElementById(id);
const intro = $('intro'), video = $('bg-video');
const fine = matchMedia('(hover: hover) and (pointer: fine)').matches;

/* Nick vira letras individuais para a animação em onda */
const nick = $('nick');
[...nick.textContent].forEach((ch, i) => {
    const s = document.createElement('span');
    s.textContent = ch;
    s.style.setProperty('--c', i);
    s.setAttribute('aria-hidden', 'true');
    nick.appendChild(s);
});
nick.firstChild.remove?.();
nick.childNodes.forEach(n => { if (n.nodeType === 3) n.remove(); });

/* Entrar: o círculo preto fecha no ponto do clique */
let entered = false;
function enter(e) {
    if (entered) return;
    entered = true;
    const x = e && e.clientX ? e.clientX : innerWidth / 2;
    const y = e && e.clientY ? e.clientY : innerHeight / 2;
    intro.style.setProperty('--x', x + 'px');
    intro.style.setProperty('--y', y + 'px');
    requestAnimationFrame(() => {
        intro.classList.add('open');
        document.body.classList.add('on');
    });
    startAudio();
    setTimeout(() => intro.remove(), 1400);
}
intro.addEventListener('click', enter);

/* Parallax suave do fundo + luz nos botões (só com mouse) */
if (fine) {
    addEventListener('pointermove', e => {
        const r = document.documentElement.style;
        r.setProperty('--px', (e.clientX / innerWidth - .5).toFixed(3));
        r.setProperty('--py', (e.clientY / innerHeight - .5).toFixed(3));
    });
    document.querySelectorAll('.link-btn').forEach(b => {
        b.addEventListener('pointermove', e => {
            const r = b.getBoundingClientRect();
            const x = e.clientX - r.left, y = e.clientY - r.top;
            b.style.setProperty('--mx', x + 'px');
            b.style.setProperty('--my', y + 'px');
            /* efeito magnético: o botão "puxa" um pouco em direção ao cursor */
            b.style.setProperty('--tx', ((x / r.width - .5) * 8).toFixed(1) + 'px');
            b.style.setProperty('--ty', ((y / r.height - .5) * 6).toFixed(1) + 'px');
        });
        b.addEventListener('pointerleave', () => {
            b.style.setProperty('--tx', '0px');
            b.style.setProperty('--ty', '0px');
        });
    });
}

/* Copiar Pix */
const chavePix = 'seu-email@exemplo.com'; // ⚠️ COLOQUE SUA CHAVE AQUI
const toast = $('toast');
function copiado() {
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2500);
}
$('pix').addEventListener('click', () => {
    (navigator.clipboard
        ? navigator.clipboard.writeText(chavePix)
        : Promise.reject()
    ).then(copiado).catch(() => {
        const t = document.createElement('textarea');
        t.value = chavePix; document.body.appendChild(t); t.select();
        try { document.execCommand('copy'); copiado(); }
        catch { alert('Erro ao copiar. A chave é: ' + chavePix); }
        t.remove();
    });
});

/* ===== VOLUME (estilo iPhone) ===== */
const VOLUME_PADRAO = 0.4; // volume inicial ao entrar (0 a 1). Use 0 para começar mudo.
const vol = $('vol'), track = $('vol-track'), fill = $('vol-fill'), muteBtn = $('vol-mute');
let level = VOLUME_PADRAO, lastLevel = VOLUME_PADRAO;
let ctx = null, gain = null;

/* iPhone ignora video.volume; nesse caso o volume passa por Web Audio */
const volumeNativo = (() => {
    const o = video.volume;
    video.volume = .5;
    const ok = video.volume === .5;
    video.volume = o;
    return ok;
})();

let duck = 1, duckRaf = 0, spotifyOn = false;   // duck: 1 = vídeo com som, 0 = vídeo calado (Spotify tocando)

function applyOutput() {
    const v = level * duck;
    if (gain) gain.gain.value = v; else video.volume = v;
    video.muted = !gain && v === 0;
}

function fadeDuck(to) {
    cancelAnimationFrame(duckRaf);
    const from = duck, t0 = performance.now(), D = 700;
    const step = now => {
        const p = Math.min(1, (now - t0) / D);
        duck = from + (to - from) * p;
        applyOutput();
        if (p < 1) duckRaf = requestAnimationFrame(step);
    };
    duckRaf = requestAnimationFrame(step);
}

function setSpotify(on) {
    if (on === spotifyOn) return;
    spotifyOn = on;
    vol.classList.toggle('spotify', on);
    fadeDuck(on ? 0 : 1);
}

const pctEl = $('vol-pct');
let pctTimer = 0;
function showPct() {
    pctEl.textContent = Math.round(level * 100) + '%';
    vol.classList.add('show-pct');
    clearTimeout(pctTimer);
    pctTimer = setTimeout(() => vol.classList.remove('show-pct'), 1600);
}

function setVolume(v) {
    level = Math.min(1, Math.max(0, v));
    if (level > 0) lastLevel = level;
    applyOutput();
    fill.style.width = (level * 100) + '%';
    vol.dataset.level = level === 0 ? 0 : level < .5 ? 1 : 2;
    track.setAttribute('aria-valuenow', Math.round(level * 100));
    muteBtn.setAttribute('aria-label', level === 0 ? 'Ativar som' : 'Silenciar');
}

function startAudio() {
    if (!volumeNativo) {
        try {
            ctx = new (window.AudioContext || window.webkitAudioContext)();
            gain = ctx.createGain();
            ctx.createMediaElementSource(video).connect(gain).connect(ctx.destination);
            ctx.resume();
        } catch (e) { ctx = gain = null; }
    }
    video.muted = false;
    setVolume(level);
    video.play().catch(() => {
        if (document.body.classList.contains('no-video')) return;
        /* navegador bloqueou com som: toca mudo e a barra mostra isso */
        setVolume(0);
        video.muted = true;
        video.play().catch(err => console.log('Autoplay bloqueado:', err));
    });
}

const fromPointer = e => {
    const r = track.getBoundingClientRect();
    setVolume((e.clientX - r.left) / r.width);
    showPct();
};
track.addEventListener('pointerdown', e => {
    track.setPointerCapture(e.pointerId);
    vol.classList.add('drag');
    fromPointer(e);
});
track.addEventListener('pointermove', e => { if (vol.classList.contains('drag')) fromPointer(e); });
['pointerup', 'pointercancel'].forEach(t =>
    track.addEventListener(t, () => vol.classList.remove('drag')));
track.addEventListener('keydown', e => {
    const step = e.shiftKey ? .2 : .05;
    const k = e.key;
    if (k === 'ArrowRight' || k === 'ArrowUp')        setVolume(level + step);
    else if (k === 'ArrowLeft' || k === 'ArrowDown')  setVolume(level - step);
    else if (k === 'Home') setVolume(0);
    else if (k === 'End')  setVolume(1);
    else return;
    showPct();
    e.preventDefault();
});
muteBtn.addEventListener('click', () => { setVolume(level > 0 ? 0 : (lastLevel || VOLUME_PADRAO)); showPct(); });
setVolume(level);

/* ===== PLAYLIST (player oficial do Spotify) ===== */
const SPOTIFY_URI   = 'spotify:playlist:2sw1VROZNQphIfwXJ8Zaeq';
const SPOTIFY_EMBED = 'https://open.spotify.com/embed/playlist/2sw1VROZNQphIfwXJ8Zaeq?utm_source=generator&si=50b462c6579c4624';
const embed = $('embed');
let spApi = null, spController = null, embedStarted = false, embedTimer = 0, spTimer = 0;

/* o Spotify avisa quando começa/pausa; é isso que faz o som do vídeo sair */
function onSpotify(e) {
    const playing = e.data && e.data.isPaused === false;
    clearTimeout(spTimer);
    if (playing) setSpotify(true);
    else spTimer = setTimeout(() => setSpotify(false), 500);
}

function criarController() {
    if (spController) return;
    clearTimeout(embedTimer);
    const holder = document.createElement('div');
    embed.append(holder);
    spApi.createController(holder, { uri: SPOTIFY_URI, width: '100%', height: '352' }, c => {
        spController = c;
        c.addListener('playback_update', onSpotify);
    });
}

/* plano B: se a API do Spotify não carregar, usa o iframe simples */
function embedSimples() {
    if (spController || embed.firstChild) return;
    const f = document.createElement('iframe');
    f.src = SPOTIFY_EMBED;
    f.setAttribute('allow', 'autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture');
    f.setAttribute('allowfullscreen', '');
    f.loading = 'lazy';
    embed.append(f);
}

window.onSpotifyIframeApiReady = api => { spApi = api; if (embedStarted) criarController(); };

function iniciarEmbed() {           // carrega só na primeira vez que o painel abre
    if (embedStarted) return;
    embedStarted = true;
    if (spApi) criarController();
    else embedTimer = setTimeout(embedSimples, 6000);
}

$('vol-sp').addEventListener('click', () => { if (spController) spController.pause(); });

const mBtn = $('music-btn'), mPanel = $('music-panel');
function toggleMusic(open = !document.body.classList.contains('music-open')) {
    document.body.classList.toggle('music-open', open);
    mPanel.inert = !open;
    if (open) iniciarEmbed();
    mBtn.setAttribute('aria-expanded', open);
    mBtn.setAttribute('aria-label', open ? 'Fechar playlist' : 'Abrir playlist');
}
mBtn.addEventListener('click', () => toggleMusic());
$('music-scrim').addEventListener('click', () => toggleMusic(false));
addEventListener('keydown', e => { if (e.key === 'Escape') toggleMusic(false); });

/* ===== ARQUIVOS: banner, foto e vídeo (aceita várias extensões) ===== */
const PASTA = 'capim';   // pasta onde ficam banner, foto e fundo
const EXT_IMG = ['jpg', 'jpeg', 'png', 'webp', 'gif', 'JPG', 'JPEG', 'PNG', 'WEBP'];

function achar(nome, exts) {
    return new Promise(ok => {
        let i = 0;
        const prox = () => {
            if (i >= exts.length) return ok(null);
            const url = PASTA + '/' + nome + '.' + exts[i++];
            const im = new Image();
            im.onload = () => ok(url);
            im.onerror = prox;
            im.src = url;
        };
        prox();
    });
}

achar('banner', EXT_IMG).then(u => { if (u) $('banner-img').style.backgroundImage = "url('" + u + "')"; });
achar('foto', EXT_IMG).then(u => {
    if (u) $('foto').src = u; else $('avatar').classList.add('no-photo');
});
$('avatar').dataset.letter = (nick.getAttribute('aria-label') || '?').trim()[0].toUpperCase();

const FORMATOS = [['mp4', 'video/mp4'], ['webm', 'video/webm'], ['mov', 'video/quicktime'], ['MP4', 'video/mp4']];
FORMATOS.forEach(([ext, type], i) => {
    const src = document.createElement('source');
    src.src = PASTA + '/fundo.' + ext;
    src.type = type;
    if (i === FORMATOS.length - 1) src.addEventListener('error', () => document.body.classList.add('no-video'));
    video.append(src);
});
video.load();
</script>
